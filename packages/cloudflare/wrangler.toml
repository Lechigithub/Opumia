# Opumia production deployment: Worker (job API + R2 proxy) → Workflow (one step per stage) → Container (renderer).
name = "opumia"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_URL = "https://opumia.example.workers.dev" # set to the deployed URL

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "opumia-media"

[[d1_databases]]
binding = "DB"
database_name = "opumia"
database_id = "00000000-0000-0000-0000-000000000000" # replace with `wrangler d1 create opumia` output
migrations_dir = "migrations"

[[workflows]]
name = "opumia-production"
binding = "PRODUCTION"
class_name = "ProductionWorkflow"

[[containers]]
class_name = "RendererContainer"
image = "../../containers/renderer/Dockerfile"
image_build_context = "../.."
instance_type = "standard-4"
max_instances = 4

[[durable_objects.bindings]]
name = "RENDERER"
class_name = "RendererContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RendererContainer"]

[observability]
enabled = true

# Secrets (wrangler secret put <NAME>): API_TOKEN, INTERNAL_TOKEN, ANTHROPIC_API_KEY, ELEVENLABS_API_KEY,
# PEXELS_API_KEY, PIXABAY_API_KEY, COVERR_API_KEY, VECTEEZY_API_KEY, VECTEEZY_ACCOUNT_ID, VIMEO_ACCESS_TOKEN,
# EUROPEANA_API_KEY, NARA_API_KEY, WIKIMEDIA_ACCESS_TOKEN, HF_API_KEY_ID, HF_API_KEY_SECRET
